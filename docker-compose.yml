# Бот + админка. Postgres уже запущен отдельно в Docker — подключаемся к его сети.
# Имя сети: docker inspect <контейнер-postgres> --format '{{json .NetworkSettings.Networks}}'
services:
  bot:
    build: .
    image: telegram-kwork-bot
    container_name: telegram-kwork-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      LOGGING_LEVEL_ORG_EXAMPLE: ${LOG_LEVEL:-INFO}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      # Админка по http: по умолчанию только localhost (ssh-туннель или reverse proxy с TLS)
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # HTTPS-прокси админки по IP сервера. Порты 80/443 заняты прокси сайта, поэтому свой порт.
  admin-proxy:
    image: caddy:2-alpine
    container_name: kwork-admin-proxy
    restart: unless-stopped
    depends_on: [bot]
    environment:
      ADMIN_PUBLIC_HOST: ${ADMIN_PUBLIC_HOST:-localhost}
    ports:
      - "${ADMIN_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile.admin:/etc/caddy/Caddyfile:ro
      - admin_proxy_data:/data
      - admin_proxy_config:/config
    networks: [db]

volumes:
  admin_proxy_data:
  admin_proxy_config:

networks:
  db:
    name: ${DB_NETWORK}
    external: true
