spring:
  application:
    name: TelegramKworkBot
  datasource:
    url: jdbc:postgresql::/localhost:5432/mydb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernat:
        format_sql: true


bot:
  token: {token}


logging:
  level:
    org.example: DEBUG
